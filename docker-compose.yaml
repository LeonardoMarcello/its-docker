services:
  its_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: its_dev
    volumes:
      - ./ros2:/home/dev/ros2:cached
      - ~/.ros:/home/dev/.ros:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    tty: true
    stdin_open: true
    # optional: maps current user's UID inside container, but final UID is set at build-time
