
# ------------------------------
# --- General ITS Parameters ---
# ------------------------------
compensate_fingertips: true     # Whether compensate for fingertip dynamic (config in bias_correction.yaml)

# INDEX -------------------------------------
sensor_4:
  sensor:
    #id: "sensor_4"
    id: "sensor_4_compensated"

  fingertip:
    id: "link_7_0_tip"

    # Relative Tranformation from F/T Frame {S}, and Object Frame {B}
    displacement: # [m]
      x: 8.0
      y: 0.0
      z: 0.0
    orientation: # [rad]
      roll: 0.0
      pitch: 1.5708
      yaw: 1.5708

    # fingertip Surface
    principalSemiAxis: # [mm]
      a: 15.0
      b: 24.5
      c: 15.0

