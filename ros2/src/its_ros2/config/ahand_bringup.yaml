# ------------------------------------
# --- Soft ITS & Solver Parameters ---
# ------------------------------------
soft_its:
  rate: 500.0
  wrench_msgs: true
  algorithm:
    verbose: false
    force_threshold: 0.15 # [N]
    method:
      name: "Closed-Form" # "Levenberg-Marquardt" | "Gauss-Newton" | "Closed-Form" | "Wrench-Method" | "Custom"



